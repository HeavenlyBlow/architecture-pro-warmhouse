worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    upstream smart-home {
        server smart-home:8081;
    }

    upstream telemetry-service {
        server telemetry-service:8082;
    }

    upstream command-service {
        server command-service:8083;
    }

    upstream device-simulator {
        server device-simulator:8084;
    }

    server {
        listen 8080;
        server_name localhost;

        location /health {
            return 200 '{"status": "ok", "service": "gateway"}';
            add_header Content-Type application/json;
        }

        # smart-home: v1 legacy sensors
        location /api/v1/sensors {
            proxy_pass http://smart-home;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # smart-home: v2 new endpoints (users, devices)
        location /api/v2/ {
            proxy_pass http://smart-home;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # smart-home: swagger
        location /smart-home/swagger/ {
            proxy_pass http://smart-home/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # telemetry-service
        location /api/v1/telemetry {
            proxy_pass http://telemetry-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # telemetry-service: swagger
        location /telemetry-service/swagger/ {
            proxy_pass http://telemetry-service/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # command-service
        location /api/v1/commands {
            proxy_pass http://command-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # command-service: swagger
        location /command-service/ {
            proxy_pass http://command-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # device-simulator
        location /api/v1/simulator {
            proxy_pass http://device-simulator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # device-simulator: swagger
        location /device-simulator/ {
            proxy_pass http://device-simulator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
